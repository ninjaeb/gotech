# Deployment config for cPanel's "Git Version Control" feature.
# When this repo is connected in cPanel (Git Version Control) and you click
# "Manage" -> "Pull or Deploy" -> "Deploy HEAD Commit", cPanel runs the
# commands below from the repo checkout directory.
#
# DEPLOYPATH uses $HOME so it resolves correctly for any cPanel account
# without editing the username. If you use a different "Application root"
# in cPanel's "Setup Node.js App" tool, change the folder name below (and
# commit the change) to match it.
# It's fine for this to be the SAME directory as the Git checkout (the path
# shown on the "Manage Repository" page) — in that case these `cp` tasks are
# redundant (the checkout already puts files in place) but harmless. Just
# make sure .gitignore covers what cPanel writes into that directory at
# runtime (.htaccess, tmp/, stderr.log, stdout.log — already covered here),
# or they'll show up as "uncommitted changes" and block future deploys.
# See the "Deploying on cPanel" section in README.md for full setup steps.
---
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/crm.gotka.com/
    - /bin/cp -R ./src $DEPLOYPATH
    - /bin/cp -R ./prisma $DEPLOYPATH
    - /bin/cp -R ./public $DEPLOYPATH
    - /bin/cp ./package.json ./package-lock.json ./next.config.ts ./tsconfig.json ./postcss.config.mjs ./eslint.config.mjs ./prisma.config.ts ./server.js $DEPLOYPATH
    # After the copy, still run these once via the cPanel Node.js app UI (or
    # SSH, with its "nodevenv" activated) — they need the app's own Node/npm:
    #   npm install            # also runs `prisma generate` via postinstall
    #   npx prisma migrate deploy
    #   then restart the app from the Node.js Selector UI
